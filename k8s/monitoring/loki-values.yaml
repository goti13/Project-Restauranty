# ─── Restauranty – Loki Stack Helm Values ─────────────────────────────────────
# Used by: helm install loki grafana/loki-stack
# Installs: Loki + Promtail
# ─────────────────────────────────────────────────────────────────────────────

loki:
  enabled: true
  persistence:
    enabled: true
    size: 2Gi
  config:
    auth_enabled: false
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h   # 7 days

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push

# ── Grafana disabled here (already installed via prometheus-stack) ─────────────
grafana:
  enabled: false
