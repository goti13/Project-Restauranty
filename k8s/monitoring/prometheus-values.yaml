# ─── Restauranty – Prometheus Stack Helm Values ───────────────────────────────
# Used by: helm install prometheus-stack prometheus-community/kube-prometheus-stack
# ─────────────────────────────────────────────────────────────────────────────

grafana:
  enabled: true

  # ── Admin credentials ────────────────────────────────────────────────────────
  adminUser: admin
  adminPassword: "Restauranty@Grafana2026!"

  # ── Disable anonymous access ──────────────────────────────────────────────────
  grafana.ini:
    auth.anonymous:
      enabled: false
    server:
      root_url: https://grafana.gerald.az.ironlabs.online

  # ── Ingress ───────────────────────────────────────────────────────────────────
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - grafana.gerald.az.ironlabs.online
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.gerald.az.ironlabs.online

  # ── Persistence ───────────────────────────────────────────────────────────────
  persistence:
    enabled: true
    size: 1Gi

  # ── Pre-configure Loki as additional datasource ───────────────────────────────
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  enabled: true
  prometheusSpec:
    retention: 7d
    # ── Additional scrape configs for Restauranty microservices ───────────────
    additionalScrapeConfigs:
      - job_name: 'restauranty-auth'
        static_configs:
          - targets: ['auth-service.restauranty.svc.cluster.local:3001']
        metrics_path: '/metrics'

      - job_name: 'restauranty-discounts'
        static_configs:
          - targets: ['discounts-service.restauranty.svc.cluster.local:3002']
        metrics_path: '/metrics'

      - job_name: 'restauranty-items'
        static_configs:
          - targets: ['items-service.restauranty.svc.cluster.local:3003']
        metrics_path: '/metrics'

# ── Alertmanager ──────────────────────────────────────────────────────────────
alertmanager:
  enabled: true

# ── Node Exporter (host-level metrics) ───────────────────────────────────────
nodeExporter:
  enabled: true

# ── kube-state-metrics (K8s object metrics) ──────────────────────────────────
kubeStateMetrics:
  enabled: true
