apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-network-policy
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    # ── Allow NGINX Ingress Controller ─────────────────────────────────────────
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000

    # ── Allow your ISP CIDR (Vodafone Germany 79.192.0.0/10) ──────────────────
    - from:
        - ipBlock:
            cidr: 79.192.0.0/10
      ports:
        - protocol: TCP
          port: 3000

    # ── Allow intra-namespace communication (Prometheus → Grafana) ─────────────
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3000
