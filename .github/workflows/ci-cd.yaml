name: Restauranty CI/CD (Version A)
# ─── Triggers ─────────────────────────────────────────────────────────────────
# Runs the full CI + CD pipeline on every push to main
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main

env:
  DOCKER_USER: otigerald
  IMAGE_TAG: ${{ github.sha }}

jobs:

  # ── CI: Build & Test ─────────────────────────────────────────────────────────
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - path: backend/auth
            name: auth
          - path: backend/discounts
            name: discounts
          - path: backend/items
            name: items
          - path: client
            name: client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service.path }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service.path }}
        run: npm ci

      - name: Build (client only)
        if: matrix.service.name == 'client'
        working-directory: client
        run: npm run build
        env:
          REACT_APP_SERVER_URL: https://gerald.az.ironlabs.online
          CI: "false"

      - name: Run tests
        if: matrix.service.name != 'client'
        working-directory: ${{ matrix.service.path }}
        run: npm test --if-present

  # ── CD: Build & Push Docker Images ───────────────────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push auth
        uses: docker/build-push-action@v5
        with:
          context: ./backend/auth
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/restauranty-auth:latest
            ${{ env.DOCKER_USER }}/restauranty-auth:${{ env.IMAGE_TAG }}

      - name: Build & Push discounts
        uses: docker/build-push-action@v5
        with:
          context: ./backend/discounts
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/restauranty-discounts:latest
            ${{ env.DOCKER_USER }}/restauranty-discounts:${{ env.IMAGE_TAG }}

      - name: Build & Push items
        uses: docker/build-push-action@v5
        with:
          context: ./backend/items
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/restauranty-items:latest
            ${{ env.DOCKER_USER }}/restauranty-items:${{ env.IMAGE_TAG }}

      - name: Build & Push client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: true
          build-args: |
            REACT_APP_SERVER_URL=https://gerald.az.ironlabs.online
            CI=false
          tags: |
            ${{ env.DOCKER_USER }}/restauranty-client:latest
            ${{ env.DOCKER_USER }}/restauranty-client:${{ env.IMAGE_TAG }}

  # ── CD: Deploy to AKS ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group geraldAKSGroup \
            --name geraldAKSCluster \
            --overwrite-existing

      - name: Apply K8s secrets
        run: |
          kubectl create secret generic restauranty-secrets \
            --from-literal=SECRET="${{ secrets.APP_SECRET }}" \
            --from-literal=MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            --from-literal=CLOUD_NAME="${{ secrets.CLOUD_NAME }}" \
            --from-literal=CLOUD_API_KEY="${{ secrets.CLOUD_API_KEY }}" \
            --from-literal=CLOUD_API_SECRET="${{ secrets.CLOUD_API_SECRET }}" \
            --namespace=restauranty \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/mongo.yaml
          kubectl apply -f k8s/auth.yaml
          kubectl apply -f k8s/discounts.yaml
          kubectl apply -f k8s/items.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Restart deployments to pull latest images
        run: |
          kubectl rollout restart deployment/auth       -n restauranty
          kubectl rollout restart deployment/discounts  -n restauranty
          kubectl rollout restart deployment/items      -n restauranty
          kubectl rollout restart deployment/frontend   -n restauranty

      - name: Wait for rollouts
        run: |
          kubectl rollout status deployment/auth       -n restauranty --timeout=120s
          kubectl rollout status deployment/discounts  -n restauranty --timeout=120s
          kubectl rollout status deployment/items      -n restauranty --timeout=120s
          kubectl rollout status deployment/frontend   -n restauranty --timeout=120s

      - name: Deployment summary
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo " Deployment complete!"
          echo " Commit : ${{ github.sha }}"
          echo " App    : https://gerald.az.ironlabs.online"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          kubectl get pods -n restauranty
